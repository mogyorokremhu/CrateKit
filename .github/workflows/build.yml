name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: cratekit-jar
          path: |
            paper/build/libs/*.jar
            fabric/build/libs/*.jar

  fabric-26-3:
    runs-on: ubuntu-latest
    name: Fabric for Minecraft 26.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: fabric-26.3
        run: |
          set +e
          ./gradlew build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "=== COMPILE ERRORS (summary) ==="
          grep -E "error:" -A2 build.log | grep -vE "^--$" | head -80
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: cratekit-fabric-26.3-jar
          path: fabric-26.3/build/libs/*.jar
