name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: cratekit-jar
          path: |
            paper/build/libs/*.jar
            fabric/build/libs/*.jar

  fabric-26-3:
    runs-on: ubuntu-latest
    name: Fabric for Minecraft 26.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: fabric-26.3
      - run: ./gradlew build
        working-directory: fabric-26.3
      - uses: actions/upload-artifact@v4
        with:
          name: cratekit-fabric-26.3-jar
          path: fabric-26.3/build/libs/*.jar
