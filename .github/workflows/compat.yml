name: Paper compatibility

# Runs the Paper plugin's tests against a simulated server for each Minecraft version we claim to support.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "1.21"
            java: 21
          - target: "26.3"
            java: 25
    name: Minecraft ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :paper-tests:test -PonlyPaper -PtestTarget=${{ matrix.target }}
