pluginManagement {
	repositories {
		maven { url = 'https://maven.fabricmc.net/' }
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'cratekit'

include 'common', 'paper', 'paper-tests'
// Pass -PonlyPaper to skip the Fabric module (used when testing under Java 25, where Fabric 1.21.11 tooling is not needed).
if (!settings.hasProperty('onlyPaper')) {
	include 'fabric'
}
